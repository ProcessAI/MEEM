name: Deploy via SSH

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'List what would be uploaded and deleted, without changing the server'
        type: boolean
        default: false

concurrency:
  group: deploy-ssh
  cancel-in-progress: false

env:
  # Absolute path of the web root on the server, e.g. /home/ezio/public_html
  # Set it in: Settings > Secrets and variables > Actions > Variables > New repository variable
  TARGET_DIR: ${{ vars.TARGET_DIR }}
  # Optional repository variable; defaults to 22
  PORT: ${{ vars.SSH_PORT || '22' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check configuration
        run: |
          if [ -z "$TARGET_DIR" ]; then
            echo "Repository variable TARGET_DIR is not set (e.g. /var/www/meem)."
            echo "Refusing to deploy: this workflow syncs with --delete and would wipe the wrong directory."
            exit 1
          fi
          case "$TARGET_DIR" in
            /|/root|/home|/var|/var/www|/usr|/etc)
              echo "TARGET_DIR=$TARGET_DIR is too broad to sync with --delete. Use a dedicated site directory."
              exit 1
              ;;
          esac

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Install sshpass
        run: sudo apt-get update && sudo apt-get install -y sshpass

      - name: Trust server host key
        env:
          HOST: ${{ secrets.HOST }}
          SSH_HOST_KEY: ${{ secrets.SSH_HOST_KEY }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          if [ -n "$SSH_HOST_KEY" ]; then
            # Pinned key: run `ssh-keyscan -p <port> <host>` once locally and store
            # the output as the SSH_HOST_KEY secret.
            printf '%s\n' "$SSH_HOST_KEY" >> ~/.ssh/known_hosts
          else
            # No pinned key: we trust whatever key answers on this run (same risk
            # profile as StrictHostKeyChecking=no). Set SSH_HOST_KEY to close this.
            echo "::warning::SSH_HOST_KEY secret not set - the server's host key is trusted on first sight each run."
            KEYS="$(ssh-keyscan -p "$PORT" "$HOST" 2>/dev/null || true)"
            if [ -z "$KEYS" ]; then
              echo "No host key came back from $HOST:$PORT."
              echo "The server is unreachable from this runner - firewall, wrong port, or an SSH IP allow-list."
              exit 1
            fi
            printf '%s\n' "$KEYS" >> ~/.ssh/known_hosts
          fi
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy dist/ to server
        env:
          # sshpass -e reads the password from SSHPASS, so it never appears in the
          # process list or in an interpolated command line.
          SSHPASS: ${{ secrets.PASSWORD }}
          SSH_USER: ${{ secrets.USER }}
          HOST: ${{ secrets.HOST }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          SSH_CMD="sshpass -e ssh -p $PORT -o StrictHostKeyChecking=yes -o BatchMode=no"

          DRY=""
          if [ "$DRY_RUN" = "true" ]; then
            DRY="--dry-run"
            echo "::notice::DRY RUN - nothing on the server will be changed."
          fi

          # The web root has to exist before anything else is worth trying.
          $SSH_CMD "$SSH_USER@$HOST" "test -d \"$TARGET_DIR\"" || {
            echo "$TARGET_DIR does not exist on $HOST, or is not a directory."
            exit 1
          }

          # Sentinel guard: rsync --delete removes everything in TARGET_DIR that is
          # not in dist/, so a mistyped path would wipe a real directory. A real
          # deploy requires an opt-in marker placed by hand, once:
          #   ssh user@host 'touch /path/to/webroot/.deploy-ok'
          # A dry run is deliberately exempt - it changes nothing, and running it
          # unarmed is how you read the delete list before committing to the path.
          if [ -z "$DRY" ]; then
            $SSH_CMD "$SSH_USER@$HOST" "test -f \"$TARGET_DIR/.deploy-ok\"" || {
              echo "$TARGET_DIR on $HOST has no .deploy-ok marker."
              echo "Run a dry run first, confirm the delete list, then on the server:"
              echo "  touch \"$TARGET_DIR/.deploy-ok\""
              exit 1
            }
          fi

          rsync -rltvz --delete $DRY \
            --exclude='.deploy-ok' \
            --exclude='.well-known/' \
            -e "$SSH_CMD" \
            dist/ "$SSH_USER@$HOST:$TARGET_DIR/"

          echo "--- deployed contents ---"
          $SSH_CMD "$SSH_USER@$HOST" "ls -la \"$TARGET_DIR\""
